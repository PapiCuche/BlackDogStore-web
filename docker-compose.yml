version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackdog
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/blackdog
      - SECRET_KEY=${SECRET_KEY:-changeme-dev-only}
      - DEBUG=${DEBUG:-1}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-izipay}
      - IZIPAY_ENV=${IZIPAY_ENV:-sandbox}
      - IZIPAY_MERCHANT_CODE=${IZIPAY_MERCHANT_CODE:-}
      - IZIPAY_PUBLIC_KEY=${IZIPAY_PUBLIC_KEY:-}
      - IZIPAY_API_KEY=${IZIPAY_API_KEY:-}
      - IZIPAY_HASH_KEY=${IZIPAY_HASH_KEY:-}
      - IZIPAY_TOKEN_URL=${IZIPAY_TOKEN_URL:-}
      - IZIPAY_CURRENCY=${IZIPAY_CURRENCY:-PEN}
      - IZIPAY_IPN_URL=${IZIPAY_IPN_URL:-}
      - CHECKOUT_RETURN_URL=${CHECKOUT_RETURN_URL:-http://localhost:3002}
    depends_on:
      - postgres
    ports:
      - '8000:8000'

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000/api
      - API_BASE=http://backend:8000/api
    ports:
      - '3002:3000'
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
    driver: local
