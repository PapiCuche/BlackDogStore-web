name: Frontend UX/UI Validation

# On pull requests, and on master after the merge. The run on master is also
# what lets the next pull request start warm: a cache saved by a pull request
# can only be read by that same pull request, one saved on master by all of
# them. (The push trigger used to name `uxui/header-hero-foundations`, a branch
# merged long ago, so no run ever saved the npm cache where others could use it.)
on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-uxui-validation.yml"
  pull_request:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-uxui-validation.yml"

permissions:
  contents: read

# A newer push to a pull request cancels the run of the older commit. A push to
# master is never cancelled and never waits behind another one.
concurrency:
  group: frontend-uxui-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
