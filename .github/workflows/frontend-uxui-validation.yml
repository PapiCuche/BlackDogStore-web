name: Frontend UX/UI Validation

on:
  push:
    branches:
      - uxui/header-hero-foundations
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-uxui-validation.yml"
  pull_request:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-uxui-validation.yml"

permissions:
  contents: read

concurrency:
  group: frontend-uxui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
