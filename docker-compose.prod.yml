# Black Dog Store — PRODUCCIÓN en un servidor (VPS) con Docker Compose.
#
#   internet ──443──> caddy ──┬── /api/*  ──> backend  (Django + gunicorn)
#                             └── lo demás ─> frontend (Next.js)
#                                             backend ──> postgres
#
# SÓLO Caddy publica puertos. Django, Next y PostgreSQL viven en la red interna
# y no son alcanzables desde internet. El `docker-compose.yml` de desarrollo
# publica el 8000 y el 5433: éste no.
#
# Uso (desde la raíz del repo, en el servidor):
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d --build
#
# Pasos completos, copias de seguridad y actualización: docs/despliegue-produccion.md

name: blackdog

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Define SITE_DOMAIN en deploy/.env.production}
      # Vacío = certificado público de Let's Encrypt. `tls internal` sólo para
      # ensayar en local, donde no hay dominio que validar.
      CADDY_TLS_DIRECTIVE: ${CADDY_TLS_DIRECTIVE:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados y claves ACME. Perder este volumen obliga a reemitir y
      # Let's Encrypt limita cuántas veces por semana.
      - caddy_data:/data
      - caddy_config:/config
    # Caddy no atiende hasta que las dos aplicaciones responden: mejor un
    # arranque que tarda que una página de error del proxy.
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000/api
        NEXT_PUBLIC_IMAGE_HOSTS: ${NEXT_PUBLIC_IMAGE_HOSTS:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    # La portada se pinta en el servidor pidiendo la configuración de la tienda
    # a Django: si responde 200, Next está arriba y llega al backend.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - deploy/.env.production
    environment:
      # Se arman aquí para que no puedan contradecir a las del resto del archivo.
      DEBUG: "0"
      DATABASE_URL: postgres://${POSTGRES_USER:-blackdog}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blackdog}
      # `backend` es el nombre con el que Next llama a Django por la red interna.
      ALLOWED_HOSTS: ${SITE_DOMAIN},www.${SITE_DOMAIN},backend
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${SITE_DOMAIN}
      FRONTEND_URL: https://${SITE_DOMAIN}
      CHECKOUT_RETURN_URL: https://${SITE_DOMAIN}
      # Exactamente UN proxy de confianza delante de Django: Caddy, que descarta
      # el X-Forwarded-For que mande el cliente y escribe la IP real.
      TRUSTED_PROXY_COUNT: "1"
      # El HTTPS termina en Caddy, que ya redirige el puerto 80. Django recibe
      # además llamadas internas de Next por HTTP; redirigirlas las rompería.
      SECURE_SSL_REDIRECT: "0"
    volumes:
      # Fotos de evidencia del servicio técnico (EVIDENCE_STORAGE_BACKEND=filesystem).
      - evidence:/app/private-media
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.Request('http://127.0.0.1:8000/api/categories/', headers={'Host': 'backend'}); sys.exit(0 if urllib.request.urlopen(r, timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackdog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-blackdog}
    volumes:
      # LA BASE DE DATOS. Productos, usuarios, pedidos y stock viven aquí.
      # `docker compose down` la conserva; `down -v` la BORRA.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackdog} -d ${POSTGRES_DB:-blackdog}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  evidence:
  caddy_data:
  caddy_config:
