                },
                "availability": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Availability"
                    },
                    {
                      "properties": {
                        "status": {
                          "const": "available"
                        },
                        "quantity": {
                          "const": 1
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "offer_kind": {
                  "type": "null"
                }
              }
            },
            "then": {
              "properties": {
                "offer_id": {
                  "type": "null"
                },
                "branch_id": {
                  "type": "null"
                }
              },
              "not": {
                "anyOf": [
                  {
                    "required": [
                      "price"
                    ]
                  },
                  {
                    "required": [
                      "availability"
                    ]
                  },
                  {
                    "required": [
                      "used_details"
                    ]
                  }
                ]
              }
            }
          },
          {
            "if": {
              "properties": {
                "offer_kind": {
                  "enum": [
                    "shelf",
                    "on_order"
                  ]
                }
              }
            },
            "then": {
              "required": [
                "price",
                "availability"
              ],
              "properties": {
                "branch_id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                }
              },
              "not": {
                "required": [
                  "used_details"
                ]
              }
            }
          },
          {
            "if": {
              "properties": {
                "offer_kind": {
                  "const": "shelf"
                }
              }
            },
            "then": {
              "properties": {
                "offer_id": {
                  "type": "null"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "offer_kind": {
                  "const": "on_order"
                }
              }
            },
            "then": {
              "properties": {
                "offer_id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                },
                "availability": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Availability"
                    },
                    {
                      "properties": {
                        "status": {
                          "const": "on_order"
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "offer_kind": {
                  "const": "used_unit"
                }
              }
            },
            "then": {
              "properties": {
                "product": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Product"
                    },
                    {
                      "properties": {
                        "condition": {
                          "const": "used"
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
