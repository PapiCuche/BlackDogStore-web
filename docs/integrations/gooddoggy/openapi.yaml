              }
            ]
          },
          "offer_id": {
            "anyOf": [
              {
                "type": "string",
                "minLength": 1,
                "maxLength": 128
              },
              {
                "type": "null"
              }
            ]
          },
          "branch_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "offer_kind": {
            "type": "string",
            "enum": [
              "shelf",
              "used_unit",
              "on_order"
            ]
          },
          "data_version": {
            "type": "integer",
            "minimum": 1
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "status": {
            "type": "string",
            "enum": [
              "available",
              "out_of_stock",
              "unknown",
              "on_order"
            ]
          },
          "quantity": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 0
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "product_id",
          "variant_id",
          "offer_id",
          "branch_id",
          "offer_kind",
          "data_version",
          "observed_at",
          "status",
          "quantity"
        ],
        "allOf": [
          {
            "if": {
              "properties": {
                "offer_kind": {
                  "const": "shelf"
                }
              }
            },
            "then": {
              "properties": {
                "offer_id": {
                  "type": "null"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "offer_kind": {
                  "enum": [
                    "used_unit",
                    "on_order"
                  ]
                }
              }
            },
            "then": {
              "properties": {
                "offer_id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "offer_kind": {
                  "const": "used_unit"
                }
              }
            },
            "then": {
              "properties": {
                "variant_id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "status": {
                  "const": "available"
                }
              }
            },
            "then": {
              "properties": {
                "quantity": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "status": {
                  "const": "out_of_stock"
                }
              }
            },
            "then": {
              "properties": {
                "quantity": {
                  "const": 0
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "status": {
                  "const": "unknown"
                }
              }
            },
            "then": {
              "properties": {
                "quantity": {
                  "type": "null"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "status": {
                  "const": "on_order"
                }
              }
            },
            "then": {
              "properties": {
                "quantity": {
                  "const": 0
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "offer_kind": {
                  "const": "used_unit"
                },
                "status": {
                  "const": "available"
                }
              }
            },
            "then": {
              "properties": {
                "quantity": {
                  "const": 1
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "status": {
                  "const": "on_order"
                }
              }
            },
            "then": {
              "properties": {
                "offer_kind": {
                  "const": "on_order"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "offer_kind": {
                  "const": "on_order"
                }
              }
            },
            "then": {
              "properties": {
                "status": {
                  "enum": [
                    "on_order",
                    "unknown",
                    "out_of_stock"
                  ]
                }
              }
            }
          }
        ]
      },
