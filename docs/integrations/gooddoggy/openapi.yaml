  "components": {
    "securitySchemes": {
      "ServiceBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "code",
          "detail"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          },
          "request_id": {
            "type": "string"
          }
        }
      },
      "Record": {
        "type": "object",
        "required": [
          "id",
          "data_version",
          "updated_at"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "data_version": {
            "type": "integer",
            "minimum": 1
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Money": {
        "type": "object",
        "required": [
          "amount",
          "currency"
        ],
        "properties": {
          "amount": {
            "type": "string",
            "pattern": "^[0-9]+\\.[0-9]{2}$",
            "example": "2499.00"
          },
          "currency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$",
            "example": "PEN"
          },
          "valid_until": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          }
        }
      },
      "Availability": {
        "type": "object",
        "required": [
          "branch_id",
          "status",
          "quantity"
        ],
        "properties": {
          "branch_id": {
            "type": "string"
          },
          "status": {
            "enum": [
              "available",
              "out_of_stock",
              "on_order",
              "unknown"
            ]
          },
          "quantity": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          }
        }
      },
      "Product": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Record"
          },
          {
            "type": "object",
            "properties": {
              "sku": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "capacity": {
                "type": "string"
              },
              "color": {
                "type": "string"
              },
              "condition": {
                "type": "string"
              },
              "url": {
                "type": "string",
                "format": "uri"
              },
              "images": {
                "type": "array",
                "items": {
                  "type": "string",
                  "format": "uri"
                }
              },
              "price": {
                "$ref": "#/components/schemas/Money"
              },
              "availability": {
                "$ref": "#/components/schemas/Availability"
              }
            }
          }
        ]
      },
      "Change": {
        "type": "object",
        "required": [
          "event_id",
          "event_type",
          "entity_id",
          "data_version",
          "occurred_at"
        ],
        "properties": {
          "event_id": {
            "type": "string",
            "format": "uuid"
          },
          "event_type": {
            "type": "string"
          },
          "entity_id": {
            "type": "string"
          },
          "data_version": {
            "type": "integer"
          },
          "occurred_at": {
            "type": "string",
            "format": "date-time"
          },
          "deleted": {
            "type": "boolean"
          }
        }
      },
      "Health": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "enum": [
              "ok",
              "degraded"
            ]
          }
        }
      }
    }
  }
